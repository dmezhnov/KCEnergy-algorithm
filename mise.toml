[tools]
bun = "latest"

[tasks.test]
description = "Test algorithm files (no-op)"
run = "echo No tests configured"

[tasks.lint]
description = "Lint .lang files"
run = "bun run scripts/lang-lint.bun.ts"

[tasks.trace]
description = "Check the trace strings of the example files (-- --write to regenerate them)"
run = "bun run scripts/trace-gen.bun.ts"

[tasks.leaves]
description = "Re-compute the sum_by_axes leaves of the example files from their own inputs"
run = "bun run scripts/leaf-check.bun.ts"

[tasks.save]
description = "Save uncommitted changes"
run = "bun run ../scripts/save.bun.ts"

[tasks.install]
description = "Install dependencies"
run = "echo No local dependencies"

[tasks.list]
description = "List all algorithm steps"
run = "ls -1 *.lang | sort"

[tasks.publish]
description = "Merge the draft branch into main (this repository only)"
run = "bun run ../scripts/publish.bun.ts"
